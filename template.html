<style>
/* Layout: a broadcast-censor console. A waveform hero, then one reading column with wide data panels. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #142033;
  --muted: #56637a;
  --rule: #d5dbe5;
  --accent: #c8246b;
  --accent-soft: #c8246b1f;
  --s-native: #1f7a8c;
  --s-qwen: #c76a12;
  --s-hybrid: #6a5acd;
  --s-mfa: #3b7d2b;
  --wave-line: #9aa8bf;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1522; --surface: #151f30; --ink: #e6ebf3; --muted: #95a2b8; --rule: #26334a;
    --accent: #ff4f98; --accent-soft: #ff4f9824; --s-native: #4cc3d6; --s-qwen: #f0a04b; --s-hybrid: #a99cff; --s-mfa: #84cf6a;
    --wave-line: #3a4c6b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1522; --surface: #151f30; --ink: #e6ebf3; --muted: #95a2b8; --rule: #26334a;
  --accent: #ff4f98; --accent-soft: #ff4f9824; --s-native: #4cc3d6; --s-qwen: #f0a04b; --s-hybrid: #a99cff; --s-mfa: #84cf6a;
  --wave-line: #3a4c6b; color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; text-wrap: balance; margin: 0; line-height: 1; }
h2 { font-size: clamp(2rem, 5vw, 2.9rem); text-transform: uppercase; }
h3 { font-size: 1.45rem; text-transform: uppercase; letter-spacing: 0.02em; }
p { margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
small { font-size: 0.78em; color: var(--muted); font-weight: 400; }

.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--rule); }
.hero__waves { position: absolute; inset: 0; }
.hero__waves::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 18%, transparent 75%); pointer-events: none; }
.hero__inner {
  position: relative; max-width: 1080px; margin: 0 auto; display: grid; gap: 22px;
  padding-block: clamp(48px, 9vw, 104px) clamp(40px, 7vw, 80px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hero__title { font-size: clamp(3.4rem, 11vw, 7.6rem); text-transform: uppercase; max-width: 9ch; line-height: 0.88; }
.hero__lede { max-width: 58ch; font-size: 1.12rem; color: var(--muted); }
.hero__facts { display: flex; flex-wrap: wrap; gap: 12px 36px; margin: 6px 0 0; }
.hero__facts div { display: grid; gap: 2px; }
.hero__facts dt { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.hero__facts dd { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }

.main {
  max-width: 1080px; margin: 0 auto; display: grid; gap: clamp(56px, 9vw, 96px);
  padding-block: clamp(48px, 8vw, 88px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.section { display: grid; gap: 28px; min-width: 0; }
.section__head { display: grid; gap: 12px; max-width: 66ch; }
.section__head > p:not(.eyebrow) { color: var(--muted); }

.chart-scroll { overflow-x: auto; min-width: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px 18px 10px; }
.chart-scroll > svg { display: block; width: 100%; height: auto; min-width: 620px; }
.miss text, .leak text { font-family: var(--font-mono); }
.mt-frame { stroke: var(--rule); stroke-width: 0.6; opacity: 0.55; }
.mt-sec { stroke: var(--rule); stroke-width: 1; }
.mt-axis, .axis { fill: var(--muted); font-size: 11px; }
.axis--title { font-family: var(--font-body) !important; font-size: 12px; }
.mt-rowlabel { fill: var(--ink); font-family: var(--font-display) !important; font-weight: 800; font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; }
.mt-word.mt-bar-native { fill: color-mix(in srgb, var(--s-native) 26%, var(--surface)); stroke: var(--s-native); stroke-width: 1; }
.mt-word.mt-bar-qwen { fill: color-mix(in srgb, var(--s-qwen) 24%, var(--surface)); stroke: var(--s-qwen); stroke-width: 1; }
.mt-word.mt-bar-mfa { fill: color-mix(in srgb, var(--s-mfa) 24%, var(--surface)); stroke: var(--s-mfa); stroke-width: 1; }
.mt-tick { stroke: var(--s-qwen); stroke-width: 2.5; }
.mt-word.is-swear { fill: var(--accent); stroke: var(--accent); }
.mt-tick.is-swear { stroke: var(--accent); stroke-width: 3.5; }
.mt-label { fill: var(--ink); font-size: 11px; pointer-events: none; }
.mt-label.is-swear { fill: #fff; font-weight: 500; }
.mt-truth { fill: var(--accent-soft); }
.mt-truth-label { fill: var(--accent); font-size: 11px; }
.mt-callout-line { stroke: var(--accent); stroke-width: 1.5; }
.mt-callout { fill: var(--accent); font-size: 11.5px; font-weight: 500; }

.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.finding { display: grid; align-content: start; gap: 8px; padding: 26px 24px !important; border-radius: 14px !important; min-width: 0; }
.finding__figure { font-family: var(--font-display); font-weight: 800; font-size: 3.3rem; line-height: 0.95; color: var(--accent); font-variant-numeric: tabular-nums; }
.finding__label { font-weight: 700; line-height: 1.3; }
.finding__body { color: var(--muted); font-size: 0.95rem; }

.grid { stroke: var(--rule); stroke-width: 1; }
.marker { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.marker-label { fill: var(--muted); font-size: 11px; }
.lc-line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.lc-line.is-lead { stroke-width: 3.5; }
.lc-leader { stroke-width: 1; opacity: 0.6; }
.lc-label { font-size: 12px; font-weight: 500; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; vertical-align: bottom; }
thead th small { text-transform: none; letter-spacing: 0; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
.num { text-align: right; white-space: nowrap; }
.tc { font-family: var(--font-mono); }
.swears, .shows { min-width: 640px; }
.swears th[scope="row"] { white-space: nowrap; font-weight: 700; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 9px; vertical-align: 1px; }
.swears__cell { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; background: color-mix(in srgb, var(--accent) calc(var(--heat) * 55%), transparent); }
.swears__cell .is-zero { color: var(--s-native); }
.swears__of { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 400; color: var(--muted); margin-left: 2px; }
.shows tbody th { font-weight: 700; }
.shows b { color: var(--accent); }
.bar { display: inline-block; width: 54px; height: 8px; margin-right: 10px; border-radius: 4px; vertical-align: 1px;
  background: linear-gradient(90deg, var(--s-qwen) calc(var(--w) * 100%), var(--rule) 0); }

.cost { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.cost__metric { display: grid; align-content: start; gap: 14px; padding: 22px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; min-width: 0; }
.cost__metric h3 { font-size: 1.25rem; }
.cost__bars { display: grid; gap: 10px; margin: 0; }
.cost__row { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: center; }
.cost__row dt { font-size: 0.9rem; font-weight: 700; white-space: nowrap; }
.cost__row dd { margin: 0; display: grid; grid-template-columns: 1fr 5.2em; gap: 10px; align-items: center; }
.cost__track { position: relative; height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--rule) 55%, transparent); overflow: hidden; }
.cost__fill, .cost__steady { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.cost__steady { background: color-mix(in srgb, var(--surface) 55%, transparent); border-right: 2px solid var(--surface); }
.cost__value { font-family: var(--font-mono); font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cost__detail { font-size: 0.88rem; color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.steps li::before { content: counter(step); grid-row: span 2; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 0.9; color: var(--accent); }
.steps p { color: var(--muted); max-width: 70ch; }
.method { font-size: 0.85rem; color: var(--muted); max-width: 80ch; font-family: var(--font-mono); line-height: 1.6; }

@media (max-width: 520px) {
  body { font-size: 16px; }
  .finding__figure { font-size: 2.8rem; }
  .hero__waves::after { background: linear-gradient(180deg, transparent, var(--bg) 85%); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
/*__COMPONENT_CSS__*/
</style>
